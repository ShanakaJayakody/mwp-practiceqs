            `NVIDIA Corporation stands as an American multinational technology giant, renowned globally for its pioneering advancements in accelerated computing and artificial intelligence (AI). The company primarily designs graphics processing units (GPUs) for the lucrative gaming and demanding professional markets, alongside system on a chip units (SoCs) crucial for mobile computing and the rapidly evolving automotive sector. Crucially, NVIDIA also provides powerful chips, systems, and software frameworks that underpin much of modern Al development and deployment. Founded in April 1993 by Jensen Huang, Chris Malachowsky, and Curtis Priem with an initial focus on the burgeoning PC graphics card market, the company maintains its headquarters in Santa Clara, California, the heart of Silicon Valley. Its early innovations helped define standards for 3D graphics acceleration.\n\nNVIDIA first gained widespread prominence with its influential GeForce line of GPUs, ultimately becoming a dominant force in high-performance graphics technology essential for realistic video gaming. Beyond the consumer sphere, its professional Quadro (now branded NVIDIA RTX) GPUs became industry standards in workstations utilized for complex tasks like computer-aided design (CAD), visual effects production, and scientific visualization. Recognizing the inherent parallel processing capabilities of their GPUs, NVIDIA strategically developed CUDA (Compute Unified Device Architecture), a revolutionary parallel computing platform and programming model. This initiative allowed developers worldwide to harness the immense processing power of GPUs for general-purpose computing tasks, extending far beyond graphics rendering. This pivotal move positioned NVIDIA definitively at the forefront of the subsequent Al revolution, with its powerful chips (like the A100 and H100 Tensor Core GPUs) becoming indispensable for training sophisticated deep learning models across countless domains. It also produces high-performance networking hardware via its Mellanox acquisition and develops comprehensive Al platforms for autonomous vehicles (NVIDIA DRIVE).\n\nReflecting its central role in powering Al advancements, NVIDIA's market capitalization surged dramatically in the early 2020s, making it one of the world's most valuable companies. Led dynamically by co-founder and long-time CEO Jensen Huang, the company consistently reports substantial revenue growth, increasingly driven by its data center segment which supplies the critical Al infrastructure demanded by cloud providers and enterprises globally. NVIDIA's influence now extends well beyond hardware; it cultivates a vast, robust ecosystem of software developers, researchers, and partners leveraging its platforms (like CUDA, Omniverse), solidifying its position as a fundamental linchpin in modern high-performance computing, data science, and artificial intelligence research and deployment worldwide.`,
            `The discovery of penicillin, routinely hailed as a watershed moment that revolutionized 20th-century medicine, occurred somewhat serendipitously, yet was built upon decades of prior observation of microbial antagonism. In September 1928, Scottish physician and microbiologist Alexander Fleming, working at St Mary's Hospital, Paddington, London, returned from a summer holiday to find that a Petri dish containing Staphylococcus bacteria cultures had been accidentally contaminated by a spore of blue-green mould, later identified as Penicillium notatum (now P. rubens). He astutely observed a distinct clear zone of inhibition surrounding the invading mould colony where the normally prolific bacteria had failed to grow, indicating the mould was producing a diffusible substance lethal to the bacteria. Fleming proceeded to isolate the mould, cultivate it in pure culture broth, and confirmed that this broth filtrate contained a substance that effectively killed several types of Gram-positive disease-causing bacteria, while appearing non-toxic to human white blood cells.\n\nFleming formally named the active antibacterial substance "penicillin" and published his seminal findings in the British Journal of Experimental Pathology in 1929. However, despite recognizing its therapeutic potential, Fleming encountered significant difficulties in isolating, purifying, and stabilizing the compound in sufficient quantities for extensive clinical use. Initial clinical tests remained limited and largely inconclusive, hampered by this chemical instability and the low concentrations achievable with his methods. Consequently, for over a decade, the profound potential of penicillin remained largely unrealized by the wider medical community, often relegated to the status of a laboratory curiosity or a useful agent for selective bacterial culture, despite Fleming's documented initial observations about its differential toxicity.\n\nThe critical impetus for transforming penicillin from curiosity to cure came during the dire circumstances of World War II. An exceptionally talented team of scientists at the Sir William Dunn School of Pathology, University of Oxford, led by pathologist Howard Florey and biochemist Ernst Boris Chain, systematically took up Fleming's earlier research with renewed vigour, driven by the urgent wartime necessity for effective antibacterial agents to treat battlefield wound infections. Employing more advanced biochemical techniques, they painstakingly devised methods for extracting and purifying penicillin in a stable, concentrated form and then rigorously demonstrated its remarkable in vivo effectiveness in treating severe bacterial infections, first in animals and then, crucially, in human patients beginning in 1941. Facing the immense challenge of scaling up production from laboratory levels to industrial quantities required for the war effort, Florey and Chain travelled to the United States later that year to seek collaboration with American pharmaceutical companies and government agencies.\n\nThis transatlantic collaboration, combined with crucial innovations in deep-tank fermentation techniques and the fortuitous discovery of a significantly more productive strain of Penicillium (reportedly found on a mouldy cantaloupe in Peoria, Illinois), finally enabled the mass production of penicillin by 1944. Its availability saved countless lives among Allied soldiers during the latter stages of the war and fundamentally revolutionized medicine thereafter. Fleming, Florey, and Chain deservedly shared the 1945 Nobel Prize in Physiology or Medicine for their collective, sequential contributions. Penicillin powerfully heralded the modern age of antibiotics, transforming the prognosis for myriad bacterial infections from often fatal conditions to largely manageable illnesses, altering human demographics and healthcare forever.`,
            `Elizabeth I (born 7 September 1533, died 24 March 1603 at Richmond Palace) reigned as Queen of England and Ireland from 17 November 1558 until her death, successfully navigating decades of intense domestic and international turmoil. Her remarkable 44-year reign is indelibly associated with a flourishing of English culture and asserting England's presence on the world stage. The daughter of the formidable Henry VIII and his ill-fated second wife, Anne Boleyn, Elizabeth's own early life was fraught with uncertainty and peril; her mother was executed on charges of treason when she was merely two years old, and Parliament subsequently declared Elizabeth illegitimate. Surviving the brief Protestant reign of her younger half-brother Edward VI and the intensely Catholic reign of her elder half-sister Mary I (during which Elizabeth faced imprisonment in the Tower of London under suspicion of supporting rebels), she unexpectedly ascended the throne at the age of 25 upon Mary's death.\n\nGoverning with formidable intelligence, pragmatism, and considerable political acumen, Elizabeth skillfully established the via media known as the Elizabethan Religious Settlement. This sought a moderate compromise, retaining some traditional structures (like bishops) while establishing Protestant doctrine, largely defining the character of the Church of England, though it perpetually faced challenges from both radical Puritans demanding further reform and Catholics seeking to restore papal authority, sometimes involving plots supported by foreign powers. She famously relied heavily on a small circle of trusted, capable advisors, most notably William Cecil (Lord Burghley). Astutely managing Parliament, often through patronage and careful rhetoric, required constant effort, particularly concerning contentious issues of royal finances, monopolies, and persistent demands for her to marry and secure the succession Elizabeth masterfully employed her potential marriage prospects as vital diplomatic tools while cultivating the powerful public image of the 'Virgin Queen' devoted solely to her kingdom. Her foreign policy was largely dominated by the long, simmering conflict with Catholic Spain under Philip II, culminating in the strategically decisive defeat of the seemingly invincible Spanish Armada in 1588, a watershed moment that immensely bolstered English national pride and maritime confidence. She also contended with protracted, costly challenges in governing Ireland and navigated complex, often tense relations with neighbouring Scotland, eventually, on her deathbed, naming the Protestant James VI of Scotland (son of her executed Catholic rival Mary, Queen of Scots) as her successor. This pragmatic choice ensured a relatively smooth dynastic transition and formally united the English and Scottish crowns under a single monarch. Despite periods of significant economic hardship, recurrent plague outbreaks, and persistent religious tensions, her long reign is generally credited with providing crucial political stability, fostering a vibrant cultural renaissance (including Shakespeare and Marlowe), and forging a stronger sense of English national identity and purpose.`,
            `Baroque music denotes a prominent and highly influential style of Western European art music composed roughly during the period from 1600 to 1750, bridging the Renaissance and the subsequent Classical eras. This extended period witnessed immense innovation and codification in musical forms, instrumentation, techniques, and aesthetic expression, laying much of the foundation for later musical developments. The term 'Baroque', possibly derived from the Portuguese word barroco (an irregularly shaped pearl), was initially employed retrospectively, often with somewhat critical connotations suggesting excessive ornamentation, complexity, or extravagance, but it now serves neutrally as the standard historical designator for the era's rich and diverse musical output, characterized fundamentally by grandeur, drama, dynamism, and affective intensity.\n\nSeveral key stylistic features consistently define Baroque music. Tonality, the system of major and minor keys providing a strong sense of harmonic direction and resolution, became firmly established during this time, largely replacing the older, more fluid system of church modes prevalent in the Renaissance. The basso continuo became a near-ubiquitous element - a continuous, improvised harmonic foundation comprising a bass line typically played by a cello, viola da gamba, or bassoon, combined with chords filled in by a keyboard instrument (harpsichord, organ) or lute. Complex polyphony and counterpoint, the intricate art of interweaving multiple independent melodic lines simultaneously, reached an apex of sophistication, particularly evident in the instrumental and choral fugues mastered by J.S. Bach. Baroque composers actively explored stark contrasts (concertato principle) - between loud and soft dynamics (terraced dynamics rather than gradual changes), contrasting instrumental timbres, soloists versus larger ensembles (as in the concerto), and different textural densities. Elaborate ornamentation and improvisation were also expected components used to embellish melodies and express intense affects or 'passions'.\n\nMajor composers indelibly associated with the Baroque include Italians like Claudio Monteverdi (a key transitional figure from Renaissance), Arcangelo Corelli, Antonio Vivaldi; Germans such as Heinrich Schütz, Johann Sebastian Bach, George Frideric Handel (who spent much of his career in England); the Frenchman Jean-Baptiste Lully; and England's Henry Purcell. Significant musical forms developed, refined, or brought to prominence during this era include the opera (combining music, drama, and spectacle), the large-scale sacred oratorio and cantata, the concerto grosso (contrasting a small group of soloists, the concertino, with the full orchestra, the ripieno), the solo concerto, the trio sonata, the keyboard suite, and the fugue. The profound expressive power, formal structures, and technical brilliance codified in Baroque music provided essential groundwork and vocabulary for the subsequent Classical period, even as the latter reacted against Baroque complexity in favour of clearer melodies, more homophonic textures, and subtler, more gradual dynamic expression.`,
            `The rapid development and increasingly sophisticated deployment of Radio Detection and Ranging (RADAR) technology emerged as a critical, often highly classified, factor profoundly influencing the strategic and tactical course, and arguably the ultimate outcome, of World War II. While the fundamental scientific principles were explored concurrently in several countries during the pre-war years, Britain's acute vulnerability and urgent need for effective early warning against anticipated German aerial bombardment spurred exceptionally rapid, state-sponsored development efforts. By the outbreak of war in 1939, the coastal Chain Home system - a network of large, fixed transmitter and receiver towers - provided crucial, albeit relatively low-resolution, detection of incoming Luftwaffe aircraft formations over the English Channel. This system played an undeniably vital strategic role during the Battle of Britain in the summer of 1940, enabling the numerically inferior RAF Fighter Command to efficiently vector its limited fighter squadrons to intercept German raids, thereby conserving precious aircraft and experienced pilots.\n\nHowever, the early Chain Home system operated at longer metric wavelengths, necessitating massive antennae installations and suffering from limitations in accuracy, altitude determination, and an inability to detect low-flying aircraft effectively. The truly pivotal technological breakthrough was the essentially independent British invention of the resonant cavity magnetron at the University of Birmingham in early 1940 by physicists John Randall and Harry Boot. This remarkably compact device could generate unprecedented levels of high-power microwave pulses at much shorter centimetric wavelengths than previously achievable. This critical innovation enabled the practical construction of powerful radar sets small and light enough to be installed effectively in aircraft and ships for the first time. Recognizing its immense military potential, the magnetron technology was crucially shared with the scientifically and industrially powerful United States through the highly secret Tizard Mission later in 1940. It rapidly became the technological heart of numerous advanced Allied radar systems developed with great urgency at institutions like the MIT Radiation Laboratory (Rad Lab).\n\nAirborne microwave radar, powered by the magnetron, proceeded to revolutionize several key aspects of WWII aerial and naval warfare. Compact airborne interception (Al) radar allowed Allied night fighters to finally locate and effectively engage German bombers attacking Britain under cover of darkness, significantly blunting the Blitz. Critically, maritime patrol aircraft like the Consolidated B-24 Liberator, equipped with air-to-surface-vessel (ASV) radar, could reliably detect surfaced German U-boats far out in the vast Atlantic, even at night or in fog and poor visibility. This capability proved instrumental in dramatically undermining the devastating submarine threat to vital Allied shipping convoys, arguably turning the tide in the Battle of the Atlantic. Furthermore, airborne radar navigation and bombing aids like H2S (using a plan position indicator display) allowed Allied heavy bombers to identify target cities and drop ordnance with significantly improved accuracy through dense cloud cover or darkness during the escalating strategic bombing campaign against industrial targets within Germany. While Axis powers, notably Germany and Japan, also developed and deployed their own radar systems (often sophisticated but hampered by competing priorities or later access to microwave technology), the decisive Allied technological lead, particularly in versatile microwave applications spearheaded by the magnetron, provided a significant and sustained operational advantage throughout much of the conflict, profoundly impacting the effectiveness of air defence, anti-submarine warfare, and strategic bombardment operations.`

            { passageIndex: 0, question: "The passage suggests NVIDIA's acquisition of Mellanox was primarily aimed at strengthening its position in the mobile computing market.", options: ["True", "False", "Can't Tell"], correctAnswer: "C" },
            { passageIndex: 0, question: "NVIDIA's financial growth in the early 2020s was driven more significantly by its professional RTX GPU sales than by its data center segment.", options: ["True", "False", "Can't Tell"], correctAnswer: "B" },
            { passageIndex: 0, question: "The passage indicates that NVIDIA's influence today relies equally on its hardware products and its software ecosystem.", options: ["True", "False", "Can't Tell"], correctAnswer: "C" },
            // Passage 2 Questions (5-8)
            { passageIndex: 1, question: "According to the passage, Fleming's initial difficulty with penicillin after its discovery primarily involved:", options: ["Proving its effectiveness against any bacteria.", "Convincing other scientists of its potential importance.", "Obtaining sufficient quantities in a stable, usable form.", "Identifying the specific species of Penicillium mould."], correctAnswer: "C" },
            { passageIndex: 1, question: "The passage suggests the Oxford team's major contribution regarding penicillin was:", options: ["The initial discovery of the mould's antibacterial effect.", "Finding a more productive strain of Penicillium on a cantaloupe.", "Developing methods for purification and demonstrating clinical effectiveness.", "Securing the Nobel Prize for Alexander Fleming alone."], correctAnswer: "C" },
            { passageIndex: 1, question: "What factor is presented in the passage as the main catalyst for the renewed effort to develop penicillin in the 1940s?", options: ["Alexander Fleming publishing updated research findings.", "The availability of new biochemical purification techniques.", "Urgent need for effective antibacterial agents during WWII.", "Pressure from American pharmaceutical companies."], correctAnswer: "C" },
            { passageIndex: 1, question: "The passage implies that penicillin's initial lack of impact for over a decade after 1929 was LEAST likely due to:", options: ["Doubts about its effectiveness against Staphylococcus.", "Problems related to its chemical stability.", "Difficulty producing sufficient amounts for clinical trials.", "Its perceived status as primarily a laboratory tool."], correctAnswer: "A" },
             // Passage 3 Questions (9-12)
            { passageIndex: 2, question: "The passage suggests Elizabeth I's approach to religion was primarily:", options: ["Aimed at restoring full papal authority in England.", "Driven by strong personal Puritan beliefs demanding radical reform.", "Focused on finding a pragmatic compromise to ensure stability.", "Largely ignored in favour of focusing solely on foreign policy."], correctAnswer: "C" },
            { passageIndex: 2, question: "Which factor is presented as directly contributing to Elizabeth I being declared illegitimate?", options: ["The execution of her mother, Anne Boleyn.", "Her suspected support for rebels during Mary I's reign.", "The Act of Parliament invalidating Henry VIII's marriage to Anne Boleyn.", "Her refusal to marry and provide a direct heir."], correctAnswer: "C" },
            { passageIndex: 2, question: "The defeat of the Spanish Armada in 1588 is portrayed in the passage primarily as:", options: ["A minor naval skirmish with little long-term significance.", "A costly victory that severely weakened the English economy.", "A successful diplomatic resolution negotiated by William Cecil.", "A key event that strengthened English nationalism and confidence."], correctAnswer: "D" },
            { passageIndex: 2, question: "Which of the following can be most reliably inferred from the passage about Elizabeth I's governance style?", options: ["She preferred direct confrontation over diplomatic maneuvering in foreign policy.", "She ruled absolutely without significant input from advisors or Parliament.", "She prioritized maintaining royal authority while pragmatically managing opposing factions.", "Her primary focus was expanding England's colonial possessions overseas."], correctAnswer: "C" },
            // Passage 4 Questions (13-16)
            { passageIndex: 3, question: "The passage suggests the term 'Baroque' when initially applied to music might have implied:", options: ["Simplicity and clarity.", "Emotional restraint.", "Mathematical precision.", "Excessive complexity or decoration."], correctAnswer: "D" },
            { passageIndex: 3, question: "A defining characteristic of Baroque harmony mentioned in the passage is the:", options: ["Frequent use of unresolved dissonances.", "Replacement of major/minor keys with church modes.", "Use of a continuous bass line with filled-in chords (basso continuo).", "Preference for gradual dynamic changes (crescendo/decrescendo)."], correctAnswer: "C" },
            { passageIndex: 3, question: "The passage supports which conclusion about the relationship between Baroque and Classical music?", options: ["Classical music completely abandoned all forms developed during the Baroque era.", "Baroque music served as essential groundwork but was reacted against by the Classical style.", "Baroque composers like Bach intentionally tried to imitate the emerging Classical style.", "The transition between Baroque and Classical was abrupt and occurred exactly in 1750."], correctAnswer: "B" },
            { passageIndex: 3, question: "The passage suggests that the basso continuo was primarily employed to:", options: ["Allow composers to write music without specifying major or minor keys.", "Provide a consistent harmonic framework supporting melodic lines.", "Replace the need for complex counterpoint in musical textures.", "Ensure music could be performed solely by keyboard instruments"], correctAnswer: "B" },
            // Passage 5 Questions (17-20)
            { passageIndex: 4, question: "The passage indicates the Chain Home system's effectiveness was limited primarily by its:", options: ["Inability to detect aircraft during nighttime.", "Reliance on technology shared by the United States.", "Use of long wavelengths restricting precision and low-altitude coverage.", "Vulnerability to German jamming techniques."], correctAnswer: "C" },
            { passageIndex: 4, question: "The invention of the cavity magnetron was significant MAINLY because it:", options: ["Was the first example of successful Anglo-American scientific collaboration.", "Allowed radar signals to travel much further than before.", "Enabled the development of compact, powerful microwave radar systems.", "Provided the theoretical basis for stealth technology used much later."], correctAnswer: "C" },
            { passageIndex: 4, question: "The passage suggests microwave radar critically impacted the Battle of the Atlantic by:", options: ["Allowing Allied ships to navigate more accurately in convoys.", "Enabling Allied aircraft to detect surfaced submarines in poor visibility.", "Jamming German U-boat communication systems effectively.", "Guiding Allied submarines to intercept German supply ships."], correctAnswer: "B" },
            { passageIndex: 4, question: "Which statement constitutes the most reasonable inference based on the passage as a whole?", options: ["German radar technology remained superior to Allied technology throughout WWII.", "The Tizard Mission was primarily focused on sharing nuclear research, not radar.", "Technological advantages in specific areas like microwave radar could significantly influence major campaigns.", "Chain Home radar became completely obsolete immediately after the invention of the magnetron."], correctAnswer: "C" }
        ];

        // --- State ---
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questionsData.length).fill(null);
        let timerInterval = null;
        const totalTime = 12 * 60; // 12 minutes
        let timeLeft = totalTime;
        let examStartTime = null;
        let currentView = 'start'; // Track the current view state ('start', 'question', 'review', 'results')

        // --- DOM Elements ---
        const startView = document.getElementById('start-view');
        const startForm = document.getElementById('start-form');
        const ucatApp = document.getElementById('ucat-app');
        const passageNumberEl = document.getElementById('passage-number');
        const passageContentEl = document.getElementById('passage-content');
        const questionNumberEl = document.getElementById('question-number');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainerEl = document.getElementById('options-container');
        const prevButton = document.getElementById('prev-button');
        const nextButton = document.getElementById('next-button');
        const navigatorButton = document.getElementById('navigator-button');
        const questionView = document.getElementById('question-view');
        const reviewView = document.getElementById('review-view');
        const resultsView = document.getElementById('results-view');
        const reviewGridEl = document.getElementById('review-grid');
        const endExamButton = document.getElementById('end-exam-button');
        const scoreEl = document.getElementById('score');
        const resultsDetailsEl = document.getElementById('results-details');
        const restartButton = document.getElementById('restart-button');
        const timerEl = document.getElementById('timer');
        const timeTakenEl = document.getElementById('time-taken');
        const navigatorModal = document.getElementById('navigator-modal');
        const navigatorGridEl = document.getElementById('navigator-grid');
        const navigatorCloseButton = document.getElementById('navigator-close-button');


        // --- Functions ---

        /** Formats seconds into MM:SS */
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
        }

        /** Starts the countdown timer */
        function startTimer() {
            stopTimer(); // Ensure no existing timer is running
            timeLeft = totalTime;
            examStartTime = Date.now();
            timerEl.textContent = formatTime(timeLeft);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = formatTime(timeLeft);
                if (timeLeft <= 0) {
                    stopTimer();
                    // Use a custom modal or message box instead of alert later
                    console.log("Time's up! The exam will now be submitted.");
                    showResults();
                }
            }, 1000);
        }

        /** Stops the countdown timer */
        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
        }

        /** Calculates time taken for the exam */
        function calculateTimeTaken() {
             if (!examStartTime) return '--:--';
            const timeElapsedInSeconds = Math.floor((Date.now() - examStartTime) / 1000);
            // Cap the time taken at the total exam time if the timer ran out
            const actualTimeTaken = Math.min(timeElapsedInSeconds, totalTime);
            return formatTime(actualTimeTaken);
        }

        /** Generates a grid of question number buttons for Navigator or Review */
        function generateQuestionGrid(targetElement, clickHandler, highlightCurrent = false) {
             targetElement.innerHTML = ''; // Clear previous grid
            questionsData.forEach((_, index) => {
                const item = document.createElement('button');
                item.textContent = index + 1;
                item.classList.add('grid-item');
                item.dataset.questionIndex = index; // Store index for click handler

                // Style based on answer status
                if (userAnswers[index] !== null) {
                    item.classList.add('grid-item-answered');
                    item.title = `Question ${index + 1} - Answered (${userAnswers[index]})`;
                } else {
                    item.classList.add('grid-item-unanswered');
                    item.title = `Question ${index + 1} - Unanswered`;
                }

                // Highlight current question in navigator modal
                if (highlightCurrent && index === currentQuestionIndex) {
                    item.classList.add('grid-item-current');
                }

                item.onclick = () => clickHandler(index); // Attach the provided click handler
                targetElement.appendChild(item);
            });
        }

        /** Loads and displays the specified question */
        function loadQuestion(index) {
            if (index < 0 || index >= questionsData.length) return; // Boundary check

            currentQuestionIndex = index;
            const questionData = questionsData[index];
            const passageIndex = questionData.passageIndex;

            // Update Passage content
            passageNumberEl.textContent = passageIndex + 1;
            // Replace newline characters with <br> tags for HTML display
            passageContentEl.innerHTML = fullPassagesText[passageIndex].replace(/\n/g, '<br><br>');

            // Update Question Number/Text
            questionNumberEl.textContent = index + 1;
            questionTextEl.textContent = questionData.question;

            // Update Options
            optionsContainerEl.innerHTML = ''; // Clear previous options
            const optionLetters = ['A', 'B', 'C', 'D']; // Assuming max 4 options
            questionData.options.forEach((option, i) => {
                const optionId = `q${index}_option${i}`;
                const letter = optionLetters[i];

                // Create radio button
                const radioInput = document.createElement('input');
                radioInput.type = 'radio';
                radioInput.id = optionId;
                radioInput.name = `question_${index}`; // Group radios for the same question
                radioInput.value = letter;
                radioInput.checked = userAnswers[index] === letter; // Check if previously answered
                radioInput.onchange = () => selectOption(letter); // Handle selection change

                // Create label wrapper for styling and click handling
                const labelWrapper = document.createElement('label');
                labelWrapper.htmlFor = optionId;
                labelWrapper.classList.add('option-label');
                labelWrapper.appendChild(radioInput);
                labelWrapper.appendChild(document.createTextNode(` ${letter}) ${option}`)); // Add letter and text
                optionsContainerEl.appendChild(labelWrapper);
            });

            // Update Button States (Previous/Next)
            prevButton.disabled = index === 0; // Disable prev on first question
            // Change Next button text on the last question
            nextButton.textContent = index === questionsData.length - 1 ? 'Go to Review' : 'Next';
            // Add/remove next arrow icon consistently
            const nextIconSVG = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>`;
            if (index !== questionsData.length - 1 && !nextButton.innerHTML.includes('svg')) {
                nextButton.innerHTML += nextIconSVG; // Add icon if not last question
            } else if (index === questionsData.length - 1 && nextButton.innerHTML.includes('svg')) {
                 nextButton.innerHTML = 'Go to Review'; // Remove icon if last question
            }

            // Ensure the question view is visible
            if (currentView !== 'question') {
                showView('question');
            }
        }

        /** Handles selecting an answer option */
        function selectOption(selectedLetter) {
            userAnswers[currentQuestionIndex] = selectedLetter;
            // Manually update radio button state if triggered by keyboard etc.
            const radioToCheck = document.querySelector(`input[name="question_${currentQuestionIndex}"][value="${selectedLetter}"]`);
            if (radioToCheck) {
                radioToCheck.checked = true;
            }
             // Optional: Auto-advance to next question after a short delay
             // setTimeout(handleNext, 300);
        }

        /** Handles 'Previous' button click */
        function handlePrevious() {
            if (currentQuestionIndex > 0) {
                loadQuestion(currentQuestionIndex - 1);
            }
        }

        /** Handles 'Next' or 'Go to Review' button click */
        function handleNext() {
             if (currentQuestionIndex < questionsData.length - 1) {
                loadQuestion(currentQuestionIndex + 1);
            } else {
                // Last question reached, go to review screen
                generateReviewScreen();
                showView('review');
            }
        }

        /** Generates the content for the review screen */
        function generateReviewScreen() {
            // Use the generic grid generator, passing the handler to load the question
            generateQuestionGrid(reviewGridEl, (index) => {
                loadQuestion(index); // Clicking a number loads that question
            });
        }

        /** Opens the navigator modal */
        function openNavigator() {
            // Use the generic grid generator, highlighting the current question
            generateQuestionGrid(navigatorGridEl, (index) => {
                navigateToQuestion(index); // Clicking a number navigates
            }, true); // Pass true to highlight the current question
            navigatorModal.classList.add('active'); // Show the modal
        }

        /** Closes the navigator modal */
        function closeNavigator() {
             navigatorModal.classList.remove('active'); // Hide the modal
        }

        /** Navigates to a specific question from the navigator */
        function navigateToQuestion(index) {
            if (index >= 0 && index < questionsData.length) {
                loadQuestion(index); // Load the selected question
                closeNavigator(); // Close the modal after navigation
            }
        }

        /** Calculates score and displays the results view */
        function showResults() {
             stopTimer(); // Stop the timer when results are shown
            let score = 0;
            resultsDetailsEl.innerHTML = ''; // Clear previous results

            questionsData.forEach((qData, index) => {
                const userAnswer = userAnswers[index];
                const correctAnswer = qData.correctAnswer;
                const isCorrect = userAnswer === correctAnswer;
                if (isCorrect) score++;

                // Create container for each question's result
                const resultItem = document.createElement('div');
                resultItem.classList.add('p-3', 'rounded-lg', 'border', 'mb-2', 'result-item-clickable'); // Added clickable class
                resultItem.classList.add(isCorrect ? 'correct-answer' : 'incorrect-answer');
                resultItem.title = `Click to review Question ${index + 1}`; // Add tooltip

                // Populate result item HTML
                resultItem.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="font-semibold mb-1">Question ${index + 1}</p>
                            <p class="text-sm mb-1"><strong>Your Answer:</strong> ${userAnswer !== null ? userAnswer : 'Not Answered'} ${isCorrect ? '<span class="text-green-700 font-semibold">(Correct)</span>' : `<span class="text-red-700 font-semibold">(Incorrect)</span>`}</p>
                            ${!isCorrect ? `<p class="text-sm"><strong>Correct Answer:</strong> ${correctAnswer}</p>` : ''}
                        </div>
                        <details class="text-xs mt-1 cursor-pointer text-right flex-shrink-0 ml-4">
                            <summary class="text-gray-500 hover:text-blue-600 font-medium">Show Q</summary>
                            <p class="mt-1 text-gray-700 text-left p-2 bg-gray-50 rounded border max-w-xs">${qData.question}</p>
                        </details>
                    </div>`;

                // *** NEW: Add click listener to the result item ***
                resultItem.onclick = (event) => {
                    // Prevent the click from triggering if the user clicked inside the <details> element
                    if (!event.target.closest('details')) {
                         reviewSpecificQuestion(index);
                    }
                };

                resultsDetailsEl.appendChild(resultItem);
            });

            // Update score and time taken display
            scoreEl.textContent = score;
            timeTakenEl.textContent = calculateTimeTaken();
            showView('results'); // Switch to the results view
        }

        // *** NEW Function: Navigate back to a specific question from results ***
        /** Loads a specific question for review from the results screen */
        function reviewSpecificQuestion(index) {
            if (index >= 0 && index < questionsData.length) {
                loadQuestion(index); // Load the question
                // No need to call showView('question') here as loadQuestion handles it if needed
            }
        }


         /** Resets the exam state and returns to the start screen */
        function restartExam() {
             stopTimer();
            currentQuestionIndex = 0;
            userAnswers.fill(null); // Clear all answers
            timeLeft = totalTime;
            timerEl.textContent = formatTime(timeLeft);
            examStartTime = null;
            showView('start'); // Go back to the start screen
        }

        /** Switches between different views of the application */
        function showView(viewName) {
            // Hide all views first
            startView.classList.add('hidden');
            ucatApp.classList.add('hidden');
            questionView.classList.add('hidden');
            reviewView.classList.add('hidden');
            resultsView.classList.add('hidden');

            currentView = viewName; // Update the global state variable

            // Show the requested view
            if (viewName === 'start') {
                startView.classList.remove('hidden');
            } else {
                 // Show the main app container for question, review, results
                 ucatApp.classList.remove('hidden');
                 // Show the specific section within the main app
                 if (viewName === 'question') questionView.classList.remove('hidden');
                 else if (viewName === 'review') reviewView.classList.remove('hidden');
                 else if (viewName === 'results') resultsView.classList.remove('hidden');
            }
        }

        // --- Keyboard Shortcut Handler ---
        function handleKeyPress(event) {
            // Only process keys if the main app is visible and the modal is not active
            if (ucatApp.classList.contains('hidden') || navigatorModal.classList.contains('active')) {
                return;
            }

            // Ignore keypresses if focus is on an input field
             if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
                return;
            }

            const key = event.key.toLowerCase();

            // Answer selection (A, B, C, D) - only works on the question view
            if (currentView === 'question' && ['a', 'b', 'c', 'd'].includes(key)) {
                event.preventDefault(); // Prevent default browser actions (e.g., find)
                const optionLetter = key.toUpperCase();
                selectOption(optionLetter);
            }

            // Navigation (Alt/Option + N/P) - works on question view
            if (event.altKey) {
                if (key === 'n') { // Alt + N for Next/Review
                    event.preventDefault();
                    if (currentView === 'question') {
                       handleNext(); // Trigger next button action
                    }
                } else if (key === 'p') { // Alt + P for Previous
                    event.preventDefault();
                    if (currentView === 'question' && !prevButton.disabled) {
                        handlePrevious(); // Trigger previous button action
                    }
                }
            }
        }


        // --- Event Listeners ---
        // Start the exam when the start form is submitted
        startForm.addEventListener('submit', (e) => {
            e.preventDefault(); // Prevent default form submission
            // TODO: Get user name, goal, focus if needed
            showView('question');
            loadQuestion(0); // Load the first question
            startTimer(); // Start the exam timer
        });

        // Navigation button listeners
        prevButton.addEventListener('click', handlePrevious);
        nextButton.addEventListener('click', handleNext);
        navigatorButton.addEventListener('click', openNavigator);
        navigatorCloseButton.addEventListener('click', closeNavigator);

        // Close navigator modal if clicked outside the content area
        navigatorModal.addEventListener('click', (e) => {
             if (e.target === navigatorModal) { // Check if the click was on the backdrop
                closeNavigator();
            }
        });

        // Add global keypress listener for shortcuts
        document.addEventListener('keydown', handleKeyPress);

        // End exam and restart button listeners
        endExamButton.addEventListener('click', showResults);
        restartButton.addEventListener('click', restartExam);

        // --- Initial Load ---
        // Show the start screen initially
        showView('start');

    </script>
